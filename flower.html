<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bông Hoa Tương Tác Cinematic 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glow: '#ff77aa',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05030a;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Glassmorphic UI Panels */
        .glass-panel {
            background: rgba(15, 12, 29, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Radial Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(circle at center, transparent 40%, rgba(3, 2, 8, 0.85) 100%);
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            height: 6px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ff6b9d;
            cursor: pointer;
            box-shadow: 0 0 10px #ff6b9d;
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .glow-text {
            text-shadow: 0 0 12px rgba(255, 120, 180, 0.6);
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between h-screen w-screen overflow-hidden">

    <!-- Canvas Containers -->
    <div id="canvas-container"></div>
    <canvas id="overlay-canvas"></canvas>
    <div class="vignette"></div>

    <!-- Top Navigation Header -->
    <header class="relative z-10 flex justify-between items-center p-4 md:p-6 w-full pointer-events-auto">
        <div class="flex items-center space-x-3">
            <div class="p-2.5 rounded-2xl glass-panel border border-pink-500/30 text-pink-400">
                <i data-lucide="flower-2" class="w-6 h-6 animate-pulse"></i>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-pink-300 via-purple-300 to-indigo-300">
                    AURA BLOOM 3D
                </h1>
                <p class="text-xs text-slate-400">Trải nghiệm Nghệ thuật Sinh học Cinematic</p>
            </div>
        </div>

        <!-- Top Right Actions -->
        <div class="flex items-center space-x-3">
            <button id="btn-audio" class="glass-panel hover:bg-white/10 text-slate-200 p-3 rounded-xl transition duration-300 flex items-center space-x-2 border border-white/10">
                <i id="icon-audio-off" data-lucide="volume-x" class="w-5 h-5 text-slate-400"></i>
                <i id="icon-audio-on" data-lucide="volume-2" class="w-5 h-5 text-pink-400 hidden"></i>
                <span class="text-xs font-medium hidden sm:inline" id="audio-status-text">Âm Thanh: Tắt</span>
            </button>
            
            <button id="btn-toggle-ui" class="glass-panel hover:bg-white/10 text-slate-200 p-3 rounded-xl transition duration-300 border border-white/10">
                <i data-lucide="sliders" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Center Interactive Hint (Fades out) -->
    <div id="interaction-hint" class="relative z-10 text-center pointer-events-none transition-opacity duration-1000 opacity-90 my-auto">
        <p class="text-xs md:text-sm uppercase tracking-widest text-pink-300/80 mb-2 font-mono">Chạm hoặc Di chuột để Tương tác</p>
        <p class="text-2xl md:text-4xl font-light tracking-wide text-white/90 drop-shadow-md">
            Chạm nhẹ để đánh thức mầm sống
        </p>
    </div>

    <!-- Bottom Controls & Customization Panel -->
    <footer class="relative z-10 w-full p-4 md:p-6 flex flex-col md:flex-row justify-between items-end gap-4 pointer-events-none">
        
        <!-- Left: Quick Action Presets -->
        <div class="pointer-events-auto flex flex-wrap gap-2 glass-panel p-2 rounded-2xl border border-white/10">
            <button id="btn-bloom" class="px-4 py-2 text-xs font-semibold rounded-xl bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white shadow-lg shadow-pink-500/25 transition active:scale-95 flex items-center gap-1.5">
                <i data-lucide="sparkles" class="w-4 h-4"></i> Nở Hoa Full
            </button>
            <button id="btn-reset" class="px-4 py-2 text-xs font-semibold rounded-xl glass-panel hover:bg-white/10 text-slate-300 transition active:scale-95">
                Khôi Phục
            </button>
            <button id="btn-rain" class="px-4 py-2 text-xs font-semibold rounded-xl glass-panel hover:bg-white/10 text-slate-300 transition active:scale-95 flex items-center gap-1.5">
                <i data-lucide="droplets" class="w-4 h-4 text-cyan-400"></i> Mưa Sương
            </button>
        </div>

        <!-- Right: Color & Morph Controls Panel -->
        <div id="controls-panel" class="pointer-events-auto glass-panel p-4 md:p-5 rounded-2xl w-full md:w-80 border border-white/10 transition-all duration-500 transform translate-y-0">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-semibold text-pink-200 flex items-center gap-2">
                    <i data-lucide="palette" class="w-4 h-4"></i> Tùy Chỉnh Bông Hoa
                </h3>
                <span class="text-[10px] text-slate-400 uppercase tracking-wider font-mono">3D Morph</span>
            </div>

            <div class="space-y-4 text-xs">
                <!-- Color Themes -->
                <div>
                    <label class="text-slate-300 block mb-2 font-medium">Bảng Màu Hoa</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button class="color-preset-btn h-8 rounded-lg border border-white/20 transition hover:scale-105" style="background: linear-gradient(135deg, #ff4b72, #6b21a8)" data-petal="#ff4b72" data-core="#ffb703" data-stem="#10b981"></button>
                        <button class="color-preset-btn h-8 rounded-lg border border-white/20 transition hover:scale-105" style="background: linear-gradient(135deg, #00f2fe, #4facfe)" data-petal="#00f2fe" data-core="#ffffff" data-stem="#059669"></button>
                        <button class="color-preset-btn h-8 rounded-lg border border-white/20 transition hover:scale-105" style="background: linear-gradient(135deg, #f9d423, #ff4e50)" data-petal="#ff4e50" data-core="#f9d423" data-stem="#15803d"></button>
                        <button class="color-preset-btn h-8 rounded-lg border border-white/20 transition hover:scale-105" style="background: linear-gradient(135deg, #e14efa, #6c5ce7)" data-petal="#e14efa" data-core="#f1c40f" data-stem="#047857"></button>
                    </div>
                </div>

                <!-- Bloom Progress Slider -->
                <div>
                    <div class="flex justify-between text-slate-300 mb-1">
                        <span>Độ Mở Cánh Hoa</span>
                        <span id="val-bloom">0%</span>
                    </div>
                    <input type="range" id="slider-bloom" min="0" max="1" step="0.01" value="0.2" class="w-full">
                </div>

                <!-- Petal Count Slider -->
                <div>
                    <div class="flex justify-between text-slate-300 mb-1">
                        <span>Số Lượng Cánh Hoa</span>
                        <span id="val-petals">24</span>
                    </div>
                    <input type="range" id="slider-petals" min="12" max="48" step="1" value="24" class="w-full">
                </div>

                <!-- Light Trail Density -->
                <div>
                    <div class="flex justify-between text-slate-300 mb-1">
                        <span>Mật Độ Phấn Hoa</span>
                        <span id="val-pollen">Cao</span>
                    </div>
                    <input type="range" id="slider-pollen" min="100" max="600" step="50" value="350" class="w-full">
                </div>
            </div>
        </div>
    </footer>

    <!-- Main Logic Script -->
    <script>
        // Initialize Icons
        lucide.createIcons();

        /* =========================================================================
           AUDIO SYNTHESIZER (Web Audio API - Procedural Ambient Music)
           ========================================================================= */
        class AmbientAudio {
            constructor() {
                this.ctx = null;
                this.isMuted = true;
                this.masterGain = null;
                this.droneOsc = null;
                this.filter = null;
                this.isInit = false;
            }

            init() {
                if (this.isInit) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                // Master Gain
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.15;
                this.masterGain.connect(this.ctx.destination);

                // Lowpass Filter for Warm Ambient Sound
                this.filter = this.ctx.createBiquadFilter();
                this.filter.type = 'lowpass';
                this.filter.frequency.value = 350;
                this.filter.connect(this.masterGain);

                // Ambient Drone Oscillator
                this.droneOsc = this.ctx.createOscillator();
                this.droneOsc.type = 'sine';
                this.droneOsc.frequency.value = 110; // A2 note
                
                // Subtle LFO modulation
                const lfo = this.ctx.createOscillator();
                lfo.frequency.value = 0.2; // 0.2 Hz cycle
                const lfoGain = this.ctx.createGain();
                lfoGain.gain.value = 15;
                lfo.connect(lfoGain);
                lfoGain.connect(this.droneOsc.frequency);
                lfo.start();

                this.droneOsc.connect(this.filter);
                this.droneOsc.start();

                this.isInit = true;
            }

            toggle() {
                if (!this.isInit) this.init();
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

                this.isMuted = !this.isMuted;
                const targetGain = this.isMuted ? 0 : 0.15;
                this.masterGain.gain.setTargetAtTime(targetGain, this.ctx.currentTime, 0.1);
                return !this.isMuted;
            }

            // Play procedural chime on interaction
            playChime(pitchModifier = 1) {
                if (this.isMuted || !this.isInit) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                // Pentatonic frequencies (hz)
                const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
                const baseFreq = scale[Math.floor(Math.random() * scale.length)];

                osc.type = 'sine';
                osc.frequency.value = baseFreq * pitchModifier;

                gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.08, this.ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 1.8);

                osc.connect(gain);
                gain.connect(this.masterGain);

                osc.start();
                osc.stop(this.ctx.currentTime + 1.8);
            }
        }

        const audio = new AmbientAudio();

        /* =========================================================================
           THREE.JS 3D SCENE & FLOWER GENERATOR
           ========================================================================= */
        let scene, camera, renderer, flowerGroup;
        let petals = [];
        let stemMesh, coreMesh, pollenParticles;
        let mouse = new THREE.Vector2();
        let targetRotation = new THREE.Vector2();
        let bloomFactor = 0.2;
        let petalCount = 24;
        let petalColor = new THREE.Color("#ff4b72");
        let coreColor = new THREE.Color("#ffb703");
        let stemColor = new THREE.Color("#10b981");

        function init3D() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05030a, 0.035);

            // Camera setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 14);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // Lighting Setup (Cinematic Multi-point)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(5, 10, 7);
            mainLight.castShadow = true;
            scene.add(mainLight);

            const rimLight = new THREE.PointLight(0xff7300, 2, 20);
            rimLight.position.set(-6, -4, -5);
            scene.add(rimLight);

            const pinkGlowLight = new THREE.PointLight(0xff0077, 3, 15);
            pinkGlowLight.position.set(0, 2, 3);
            scene.add(pinkGlowLight);

            // Parent Group for Flower
            flowerGroup = new THREE.Group();
            flowerGroup.position.y = -2;
            scene.add(flowerGroup);

            // Build Initial Flower
            buildFlower();

            // Ambient Floating Pollen in 3D Space
            create3DPollen();

            // Window Resize Listener
            window.addEventListener('resize', onWindowResize);
        }

        /* Custom Petal Geometry Creator using Procedural Curves */
        function createPetalGeometry() {
            const shape = new THREE.Shape();
            
            // Draw half petal curve
            shape.moveTo(0, 0);
            shape.quadraticCurveTo(0.6, 1.5, 0.8, 3.0);
            shape.quadraticCurveTo(0.4, 4.2, 0, 5.0);
            shape.quadraticCurveTo(-0.4, 4.2, -0.8, 3.0);
            shape.quadraticCurveTo(-0.6, 1.5, 0, 0);

            const extrudeSettings = {
                steps: 1,
                depth: 0.08,
                bevelEnabled: true,
                bevelThickness: 0.05,
                bevelSize: 0.05,
                bevelSegments: 3
            };

            const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geom.center();
            // Adjust pivot to base of petal
            geom.translate(0, 2.5, 0);
            return geom;
        }

        function buildFlower() {
            // Clear existing elements if rebuilding
            while(flowerGroup.children.length > 0){ 
                const obj = flowerGroup.children[0];
                flowerGroup.remove(obj); 
            }
            petals = [];

            // Material for Petals (Subsurface-like scattering feel)
            const petalMaterial = new THREE.MeshStandardMaterial({
                color: petalColor,
                roughness: 0.3,
                metalness: 0.1,
                side: THREE.DoubleSide,
                wireframe: false,
            });

            const petalGeom = createPetalGeometry();

            // Create Petal Layers (Multiple Concentric Rings)
            const rings = 3;
            const petalsPerRing = Math.floor(petalCount / rings);

            for (let r = 0; r < rings; r++) {
                const ringRadius = 0.3 + r * 0.2;
                const scale = 1 - r * 0.18;

                for (let i = 0; i < petalsPerRing; i++) {
                    const angle = (i / petalsPerRing) * Math.PI * 2 + (r * 0.2); // Offset rings
                    const petalMesh = new THREE.Mesh(petalGeom, petalMaterial.clone());

                    petalMesh.scale.set(scale, scale, scale);
                    petalMesh.position.set(Math.cos(angle) * ringRadius, 0.5, Math.sin(angle) * ringRadius);

                    // Initial Rotation
                    petalMesh.rotation.y = -angle + Math.PI / 2;
                    petalMesh.rotation.x = Math.PI / 2.2; // Closed bud position by default

                    // Save custom metadata for animation interpolation
                    petalMesh.userData = {
                        ring: r,
                        angle: angle,
                        baseRotX: Math.PI / 2.2,
                        targetRotX: (Math.PI / 3) + (r * 0.2) // Fully open angle
                    };

                    flowerGroup.add(petalMesh);
                    petals.push(petalMesh);
                }
            }

            // Stem Creation (Smooth Curved Cylinder)
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, -5, -0.5),
                new THREE.Vector3(0.2, -3, 0.2),
                new THREE.Vector3(-0.1, -1, -0.1),
                new THREE.Vector3(0, 0.3, 0)
            ]);
            const stemGeom = new THREE.TubeGeometry(curve, 32, 0.18, 12, false);
            const stemMat = new THREE.MeshStandardMaterial({
                color: stemColor,
                roughness: 0.6,
                metalness: 0.1
            });
            stemMesh = new THREE.Mesh(stemGeom, stemMat);
            flowerGroup.add(stemMesh);

            // Receptacle / Center Core (Glowing Seed Pod)
            const coreGeom = new THREE.SphereGeometry(0.6, 32, 32);
            const coreMat = new THREE.MeshStandardMaterial({
                color: coreColor,
                roughness: 0.2,
                emissive: coreColor,
                emissiveIntensity: 0.4
            });
            coreMesh = new THREE.Mesh(coreGeom, coreMat);
            coreMesh.position.y = 0.4;
            coreMesh.scale.y = 0.6;
            flowerGroup.add(coreMesh);

            updatePetalBloom();
        }

        /* Update Flower Petals Rotation Based on Bloom Factor */
        function updatePetalBloom() {
            petals.forEach((petal) => {
                const ringDelay = petal.userData.ring * 0.15;
                const effectiveBloom = Math.max(0, Math.min(1, (bloomFactor - ringDelay) / (1 - ringDelay)));
                
                // Interpolate X Rotation from closed bud to open flower
                const currentRotX = THREE.MathUtils.lerp(
                    petal.userData.baseRotX,
                    petal.userData.targetRotX,
                    effectiveBloom
                );

                petal.rotation.x = currentRotX;
            });
        }

        /* Floating 3D Pollen Particle System */
        function create3DPollen() {
            const count = 400;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const scales = new Float32Array(count);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 15;
                positions[i + 1] = (Math.random() - 0.5) * 15;
                positions[i + 2] = (Math.random() - 0.5) * 15;
                scales[i / 3] = Math.random() * 0.08 + 0.02;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0xffd700,
                size: 0.1,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            pollenParticles = new THREE.Points(geometry, material);
            scene.add(pollenParticles);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeOverlayCanvas();
        }

        /* =========================================================================
           2D OVERLAY CANVAS (Light Trails, Ripples, Floating Pollen Glow)
           ========================================================================= */
        const overlayCanvas = document.getElementById('overlay-canvas');
        const ctx = overlayCanvas.getContext('2d');
        let ripples = [];
        let lightTrails = [];

        function resizeOverlayCanvas() {
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
        }
        resizeOverlayCanvas();

        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 2;
                this.maxRadius = Math.random() * 60 + 40;
                this.alpha = 1;
                this.color = `hsla(${Math.random() * 60 + 320}, 100%, 75%, `;
            }

            update() {
                this.radius += 2.5;
                this.alpha -= 0.02;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = this.color + this.alpha + ')';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        class LightTrail {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2 - 1;
                this.size = Math.random() * 3 + 1;
                this.alpha = 1;
                this.color = `hsl(${Math.random() * 40 + 330}, 100%, 70%)`;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.015;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function triggerWaterRipple(x, y) {
            ripples.push(new Ripple(x, y));
            for (let i = 0; i < 6; i++) {
                lightTrails.push(new LightTrail(x, y));
            }
        }

        /* Rain effect generator */
        let isRaining = false;
        let rainInterval = null;

        function toggleRain() {
            isRaining = !isRaining;
            const rainBtn = document.getElementById('btn-rain');
            if (isRaining) {
                rainBtn.classList.add('bg-cyan-500/20', 'border-cyan-400');
                rainInterval = setInterval(() => {
                    const rx = Math.random() * window.innerWidth;
                    const ry = Math.random() * window.innerHeight;
                    triggerWaterRipple(rx, ry);
                    audio.playChime(1.5);
                }, 200);
            } else {
                rainBtn.classList.remove('bg-cyan-500/20', 'border-cyan-400');
                clearInterval(rainInterval);
            }
        }

        /* =========================================================================
           MAIN ANIMATION LOOP (RENDER & INTERACTION LOGIC)
           ========================================================================= */
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Smooth Camera / Flower Parallax Rotation
            targetRotation.x = mouse.x * 0.4;
            targetRotation.y = mouse.y * 0.4;

            flowerGroup.rotation.y += (targetRotation.x - flowerGroup.rotation.y) * 0.05;
            flowerGroup.rotation.x += (targetRotation.y - flowerGroup.rotation.x) * 0.05;

            // Gentle Idle Breathing Movement
            flowerGroup.position.y = -2 + Math.sin(elapsedTime * 1.5) * 0.15;
            flowerGroup.rotation.z = Math.sin(elapsedTime * 0.8) * 0.03;

            // Rotate floating pollen in background
            if (pollenParticles) {
                pollenParticles.rotation.y = elapsedTime * 0.03;
                pollenParticles.rotation.x = Math.sin(elapsedTime * 0.02) * 0.1;
            }

            // Core Pulse Glow
            if (coreMesh) {
                coreMesh.material.emissiveIntensity = 0.3 + Math.sin(elapsedTime * 3) * 0.2;
            }

            // Render 3D Scene
            renderer.render(scene, camera);

            // Render 2D Canvas Overlays
            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            // Update & Draw Ripples
            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].update();
                ripples[i].draw();
                if (ripples[i].alpha <= 0) ripples.splice(i, 1);
            }

            // Update & Draw Light Trails
            for (let i = lightTrails.length - 1; i >= 0; i--) {
                lightTrails[i].update();
                lightTrails[i].draw();
                if (lightTrails[i].alpha <= 0) lightTrails.splice(i, 1);
            }
        }

        /* =========================================================================
           EVENT LISTENERS & INTERACTION HANDLERS
           ========================================================================= */
        window.addEventListener('mousemove', (e) => {
            // Normalized mouse coordinates [-1, 1]
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            // Spawn light particles on mouse move
            if (Math.random() < 0.3) {
                lightTrails.push(new LightTrail(e.clientX, e.clientY));
            }
        });

        // Touch support for mobile devices
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
                if (Math.random() < 0.4) {
                    lightTrails.push(new LightTrail(touch.clientX, touch.clientY));
                }
            }
        }, { passive: true });

        // Click / Tap to Trigger Growth & Sound Chime
        window.addEventListener('pointerdown', (e) => {
            // Avoid triggering when clicking UI controls
            if (e.target.closest('#controls-panel') || e.target.closest('header') || e.target.closest('button')) {
                return;
            }

            // Hide interaction hint after first click
            const hint = document.getElementById('interaction-hint');
            if (hint) hint.style.opacity = '0';

            // Water ripple effect at touch location
            triggerWaterRipple(e.clientX, e.clientY);

            // Increment bloom smoothly
            if (bloomFactor < 1) {
                gsap.to(window, {
                    duration: 1.2,
                    bloomFactor: Math.min(1, bloomFactor + 0.25),
                    ease: "power2.out",
                    onUpdate: () => {
                        updatePetalBloom();
                        document.getElementById('slider-bloom').value = bloomFactor;
                        document.getElementById('val-bloom').textContent = `${Math.round(bloomFactor * 100)}%`;
                    }
                });
            }

            // Play procedural synth sound
            audio.playChime(0.8 + bloomFactor * 0.6);
        });

        /* UI Control Listeners */
        document.getElementById('slider-bloom').addEventListener('input', (e) => {
            bloomFactor = parseFloat(e.target.value);
            document.getElementById('val-bloom').textContent = `${Math.round(bloomFactor * 100)}%`;
            updatePetalBloom();
        });

        document.getElementById('slider-petals').addEventListener('input', (e) => {
            petalCount = parseInt(e.target.value);
            document.getElementById('val-petals').textContent = petalCount;
            buildFlower();
        });

        document.getElementById('slider-pollen').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('val-pollen').textContent = val > 400 ? 'Rất Cao' : (val > 250 ? 'Cao' : 'Trung Bình');
            if (pollenParticles) {
                pollenParticles.geometry.setDrawRange(0, val);
            }
        });

        // Color Preset Buttons
        document.querySelectorAll('.color-preset-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const pColor = e.target.getAttribute('data-petal');
                const cColor = e.target.getAttribute('data-core');
                const sColor = e.target.getAttribute('data-stem');

                petalColor.set(pColor);
                coreColor.set(cColor);
                stemColor.set(sColor);

                // Re-color petals with GSAP smooth animation
                petals.forEach(petal => {
                    gsap.to(petal.material.color, {
                        r: petalColor.r,
                        g: petalColor.g,
                        b: petalColor.b,
                        duration: 0.8
                    });
                });

                if (coreMesh) {
                    gsap.to(coreMesh.material.color, { r: coreColor.r, g: coreColor.g, b: coreColor.b, duration: 0.8 });
                    gsap.to(coreMesh.material.emissive, { r: coreColor.r, g: coreColor.g, b: coreColor.b, duration: 0.8 });
                }

                if (stemMesh) {
                    gsap.to(stemMesh.material.color, { r: stemColor.r, g: stemColor.g, b: stemColor.b, duration: 0.8 });
                }

                audio.playChime(1.2);
            });
        });

        // Preset Actions
        document.getElementById('btn-bloom').addEventListener('click', () => {
            gsap.to(window, {
                duration: 2.5,
                bloomFactor: 1,
                ease: "elastic.out(1, 0.5)",
                onUpdate: () => {
                    updatePetalBloom();
                    document.getElementById('slider-bloom').value = bloomFactor;
                    document.getElementById('val-bloom').textContent = `${Math.round(bloomFactor * 100)}%`;
                }
            });
            audio.playChime(1.5);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            gsap.to(window, {
                duration: 1.5,
                bloomFactor: 0.1,
                ease: "power2.inOut",
                onUpdate: () => {
                    updatePetalBloom();
                    document.getElementById('slider-bloom').value = bloomFactor;
                    document.getElementById('val-bloom').textContent = `${Math.round(bloomFactor * 100)}%`;
                }
            });
        });

        document.getElementById('btn-rain').addEventListener('click', toggleRain);

        // Audio Toggle
        const audioBtn = document.getElementById('btn-audio');
        audioBtn.addEventListener('click', () => {
            const isPlaying = audio.toggle();
            document.getElementById('icon-audio-off').classList.toggle('hidden', isPlaying);
            document.getElementById('icon-audio-on').classList.toggle('hidden', !isPlaying);
            document.getElementById('audio-status-text').textContent = isPlaying ? 'Âm Thanh: Bật' : 'Âm Thanh: Tắt';
        });

        // Toggle UI panel visibility
        const toggleUiBtn = document.getElementById('btn-toggle-ui');
        const controlsPanel = document.getElementById('controls-panel');
        let isPanelVisible = true;

        toggleUiBtn.addEventListener('click', () => {
            isPanelVisible = !isPanelVisible;
            if (isPanelVisible) {
                controlsPanel.style.transform = 'translateY(0)';
                controlsPanel.style.opacity = '1';
                controlsPanel.style.pointerEvents = 'auto';
            } else {
                controlsPanel.style.transform = 'translateY(120%)';
                controlsPanel.style.opacity = '0';
                controlsPanel.style.pointerEvents = 'none';
            }
        });

        // Initialize Everything on Window Load
        window.onload = () => {
            init3D();
            animate();
        };
    </script>
</body>
</html>
